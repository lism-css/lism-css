<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline data URI keeps the dev server from logging a favicon 404. -->
    <link rel="icon" href="data:," />
    <title>Lism Mock</title>
    <script>
      // Apply the stored theme before the first paint so the viewer never flashes.
      // Keep the storage key in sync with viewer/src/lib/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('lism-mock:theme');
          var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('set--dark');
        } catch (e) {
          /* localStorage can be unavailable (private mode); fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
